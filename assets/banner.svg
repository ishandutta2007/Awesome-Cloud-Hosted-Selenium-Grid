<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 420" width="100%" height="100%">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a0f1d" />
      <stop offset="50%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#050814" />
    </linearGradient>

    <!-- Selenium Emerald & Tech Blue Gradients -->
    <linearGradient id="accentGradient" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00D26A" />
      <stop offset="50%" stop-color="#00B4D8" />
      <stop offset="100%" stop-color="#7B2CBF" />
    </linearGradient>

    <linearGradient id="cardGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="rgba(255, 255, 255, 0.07)" />
      <stop offset="100%" stop-color="rgba(255, 255, 255, 0.02)" />
    </linearGradient>

    <!-- Grid Pattern -->
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="rgba(255, 255, 255, 0.04)" stroke-width="1" />
    </pattern>

    <!-- Glow Filter -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="16" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>

    <filter id="glow-subtle" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <style>
    .title-text {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
      font-weight: 800;
      font-size: 52px;
      fill: #ffffff;
      letter-spacing: -1px;
    }
    .subtitle-text {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
      font-weight: 400;
      font-size: 20px;
      fill: #94a3b8;
    }
    .badge-text {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
      font-weight: 600;
      font-size: 13px;
      fill: #cbd5e1;
    }
    .glow-orb {
      animation: pulse 6s ease-in-out infinite alternate;
    }
    .node-pulse {
      animation: nodeBlink 3s ease-in-out infinite alternate;
    }
    .flow-line {
      stroke-dasharray: 8 6;
      animation: dashMove 20s linear infinite;
    }
    @keyframes pulse {
      0% { opacity: 0.35; transform: scale(0.95); }
      100% { opacity: 0.7; transform: scale(1.08); }
    }
    @keyframes dashMove {
      to { stroke-dashoffset: -1000; }
    }
    @keyframes nodeBlink {
      0% { r: 5; opacity: 0.5; }
      100% { r: 8; opacity: 1; }
    }
  </style>

  <!-- Deep Background -->
  <rect width="100%" height="100%" fill="url(#bgGradient)" />
  <rect width="100%" height="100%" fill="url(#grid)" />

  <!-- Dynamic Glowing Mesh Background Orbs (Behind content) -->
  <g class="glow-orb" filter="url(#glow)">
    <circle cx="180" cy="110" r="130" fill="#00D26A" opacity="0.22" />
    <circle cx="1020" cy="280" r="150" fill="#00B4D8" opacity="0.2" />
    <circle cx="680" cy="60" r="110" fill="#7B2CBF" opacity="0.18" />
  </g>

  <!-- Dynamic Network / Grid Flow Diagram (Subtle Background Elements) -->
  <g opacity="0.4" stroke-width="1.5">
    <path class="flow-line" d="M 120 330 Q 350 260, 600 320 T 1080 300" fill="none" stroke="#00B4D8" />
    <path class="flow-line" d="M 80 180 Q 400 90, 750 160 T 1120 120" fill="none" stroke="#00D26A" />
    <path class="flow-line" d="M 250 380 Q 550 390, 850 340 T 1160 380" fill="none" stroke="#7B2CBF" />

    <!-- Grid Nodes -->
    <circle cx="280" cy="280" r="6" fill="#00D26A" class="node-pulse" />
    <circle cx="600" cy="320" r="7" fill="#00B4D8" class="node-pulse" />
    <circle cx="920" cy="310" r="6" fill="#7B2CBF" class="node-pulse" />
    <circle cx="750" cy="160" r="5" fill="#00D26A" class="node-pulse" />
  </g>

  <!-- Glassmorphic Banner Frame Border -->
  <rect x="25" y="25" width="1150" height="370" rx="20" fill="none" stroke="rgba(255, 255, 255, 0.12)" stroke-width="1.5" />

  <!-- Selenium Brand Logo Hexagon / Node Icon in Top Left -->
  <g transform="translate(60, 52)">
    <rect width="64" height="64" rx="16" fill="url(#cardGrad)" stroke="rgba(0, 210, 106, 0.4)" stroke-width="2" />
    <text x="32" y="44" font-family="-apple-system, sans-serif" font-weight="900" font-size="34" fill="#00D26A" text-anchor="middle">Se</text>
  </g>

  <!-- Foreground Content: Header, Category & Titles (Crisp, High Contrast) -->
  <!-- Top Category Tag -->
  <g transform="translate(142, 60)">
    <rect x="0" y="0" width="220" height="28" rx="14" fill="rgba(0, 210, 106, 0.15)" stroke="rgba(0, 210, 106, 0.45)" stroke-width="1" />
    <circle cx="14" cy="14" r="4" fill="#00D26A" />
    <text x="26" y="19" font-family="-apple-system, sans-serif" font-weight="700" font-size="11" fill="#4ade80" letter-spacing="1">CURATED AWESOME LIST</text>
  </g>

  <!-- Main Title -->
  <g transform="translate(60, 170)">
    <text class="title-text">
      Cloud-Hosted <tspan fill="url(#accentGradient)">Selenium Grid</tspan>
    </text>
  </g>

  <!-- Subtitle -->
  <g transform="translate(60, 215)">
    <text class="subtitle-text">
      The definitive directory of SaaS remote browser clouds &amp; open-source distributed test grids
    </text>
  </g>

  <!-- Feature Interactive/Dynamic Style Pills -->
  <g transform="translate(60, 275)">
    <!-- Pill 1: Selenium & Playwright -->
    <g transform="translate(0, 0)">
      <rect width="180" height="42" rx="12" fill="url(#cardGrad)" stroke="rgba(255, 255, 255, 0.15)" stroke-width="1.2" />
      <circle cx="22" cy="21" r="5" fill="#00D26A" />
      <text x="38" y="26" class="badge-text">Selenium &amp; Playwright</text>
    </g>

    <!-- Pill 2: Browser Orchestration -->
    <g transform="translate(195, 0)">
      <rect width="200" height="42" rx="12" fill="url(#cardGrad)" stroke="rgba(255, 255, 255, 0.15)" stroke-width="1.2" />
      <circle cx="22" cy="21" r="5" fill="#00B4D8" />
      <text x="38" y="26" class="badge-text">Parallel Orchestration</text>
    </g>

    <!-- Pill 3: Docker & Kubernetes -->
    <g transform="translate(410, 0)">
      <rect width="195" height="42" rx="12" fill="url(#cardGrad)" stroke="rgba(255, 255, 255, 0.15)" stroke-width="1.2" />
      <circle cx="22" cy="21" r="5" fill="#7B2CBF" />
      <text x="38" y="26" class="badge-text">Docker &amp; Kubernetes</text>
    </g>

    <!-- Pill 4: Real Device Clouds -->
    <g transform="translate(620, 0)">
      <rect width="185" height="42" rx="12" fill="url(#cardGrad)" stroke="rgba(255, 255, 255, 0.15)" stroke-width="1.2" />
      <circle cx="22" cy="21" r="5" fill="#F77F00" />
      <text x="38" y="26" class="badge-text">Real Device Labs</text>
    </g>

    <!-- Pill 5: Market Intelligence -->
    <g transform="translate(820, 0)">
      <rect width="195" height="42" rx="12" fill="url(#cardGrad)" stroke="rgba(255, 255, 255, 0.15)" stroke-width="1.2" />
      <circle cx="22" cy="21" r="5" fill="#EC4899" />
      <text x="38" y="26" class="badge-text">Pricing &amp; Valuations</text>
    </g>
  </g>

  <!-- Bottom Mini Tech Indicator -->
  <g transform="translate(60, 355)">
    <text font-family="-apple-system, sans-serif" font-size="12" fill="#64748b" font-weight="500">
      ⚡ Scalable Remote WebDriver Hubs • Cloud Execution Infrastructure • CI/CD Automated Pipelines
    </text>
  </g>
</svg>
