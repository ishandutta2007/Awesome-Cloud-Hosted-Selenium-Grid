<svg xmlns="http://www.w3.org/2000/svg" width="100%" height="100%" viewBox="0 0 1200 420"><defs><linearGradient id="bgGradient" x1="0%" x2="100%" y1="0%" y2="100%"><stop offset="0%" stop-color="#0a0f1d"/><stop offset="50%" stop-color="#0f172a"/><stop offset="100%" stop-color="#050814"/></linearGradient><linearGradient id="accentGradient" x1="0%" x2="100%" y1="0%" y2="0%"><stop offset="0%" stop-color="#00D26A"/><stop offset="50%" stop-color="#00B4D8"/><stop offset="100%" stop-color="#7B2CBF"/></linearGradient><linearGradient id="cardGrad" x1="0%" x2="100%" y1="0%" y2="100%"><stop offset="0%" stop-color="rgba(255, 255, 255, 0.07)"/><stop offset="100%" stop-color="rgba(255, 255, 255, 0.02)"/></linearGradient><pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse"><path fill="none" stroke="rgba(255, 255, 255, 0.04)" stroke-width="1" d="M 40 0 L 0 0 0 40"/></pattern><filter id="glow" width="140%" height="140%" x="-20%" y="-20%"><feGaussianBlur result="blur" stdDeviation="16"/><feComposite in="SourceGraphic" in2="blur" operator="over"/></filter><filter id="glow-subtle" width="140%" height="140%" x="-20%" y="-20%"><feGaussianBlur result="blur" stdDeviation="8"/><feComposite in="SourceGraphic" in2="blur" operator="over"/></filter></defs><style>@keyframes pulse{0%{opacity:.35;transform:scale(.95)}}@keyframes nodeBlink{0%{r:5;opacity:.5}}.badge-text,.subtitle-text,.title-text{font-family:-apple-system,BlinkMacSystemFont,&quot;Segoe UI&quot;,Roboto,&quot;Helvetica Neue&quot;,Arial,sans-serif}.title-text{font-weight:800;font-size:52px;fill:#fff;letter-spacing:-1px}.subtitle-text{font-weight:400;font-size:20px;fill:#94a3b8}.badge-text{font-weight:600;font-size:13px;fill:#cbd5e1}.glow-orb{animation:pulse 6s ease-in-out infinite alternate}.node-pulse{animation:nodeBlink 3s ease-in-out infinite alternate}.flow-line{stroke-dasharray:8 6;animation:dashMove 20s linear infinite}</style><rect width="100%" height="100%" fill="url(#bgGradient)"/><rect width="100%" height="